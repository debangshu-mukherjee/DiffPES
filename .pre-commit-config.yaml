repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(pyproject\.toml|src/.*\.py|tests/.*\.py|automatons/.*\.py)$
      - id: ruff-format
        files: ^(src/.*\.py|tests/.*\.py|automatons/.*\.py)$

  - repo: local
    hooks:
      - id: pydoclint
        name: pydoclint
        entry: uv run --frozen pydoclint
        language: system
        files: ^src/.*\.py$
      - id: ty
        name: ty
        entry: uv run --frozen ty check
        language: system
        pass_filenames: false
      - id: docs-strict-build
        name: strict sphinx build (Read the Docs parity)
        entry: >-
          uv run --frozen sphinx-build -W -a -E --keep-going -b html
          docs/source docs/build/html
        language: system
        pass_filenames: false
        files: >-
          ^(docs/source/.*|README\.md|src/.*\.py|\.readthedocs\.yaml)$
      - id: notebook-output-strip
        name: strip tutorial notebook outputs
        entry: uv run --frozen python tests/_tutorials.py --strip
        language: system
        pass_filenames: false
        files: ^tutorials/.*\.ipynb$
        require_serial: true
      - id: tutorial-policy
        name: tutorial canonical layout and output policy
        entry: uv run --frozen python tests/_tutorials.py
        language: system
        pass_filenames: false
        files: >-
          ^(docs/source/tutorials/.*|tests/_tutorials\.py|tutorials/.*|pyproject\.toml)$
      - id: loc-badge
        name: loc badge (local count, no CI commits)
        entry: uv run --frozen python .github/badges/loc_badge.py
        language: system
        pass_filenames: false
        always_run: true
      - id: requirements-export
        name: requirements.txt export (GitHub dependency graph)
        entry: >
          uv export --frozen --all-extras --no-emit-project --no-hashes
          --quiet --output-file requirements.txt
        language: system
        pass_filenames: false
        always_run: true
