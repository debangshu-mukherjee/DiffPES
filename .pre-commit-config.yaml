repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(pyproject\.toml|src/.*\.py|tests/.*\.py|tutorials/.*\.py)$
      - id: ruff-format
        files: ^(src/.*\.py|tests/.*\.py|tutorials/.*\.py)$

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: jupytext-sync
        name: jupytext tutorial pair sync
        entry: uv run --frozen jupytext --sync
        language: system
        files: ^(docs/source/tutorials/.*\.ipynb|tutorials/.*\.py)$
        require_serial: true
      - id: notebook-output-strip
        name: strip tutorial notebook outputs
        entry: uv run --frozen python tests/_tutorials.py --strip
        language: system
        pass_filenames: false
        files: ^docs/source/tutorials/.*\.ipynb$
        require_serial: true
      - id: tutorial-policy
        name: tutorial pair and output policy
        entry: uv run --frozen python tests/_tutorials.py
        language: system
        pass_filenames: false
        files: >-
          ^(docs/source/tutorials/.*\.ipynb|tutorials/.*\.py|pyproject\.toml)$
      - id: loc-badge
        name: loc badge (local count, no CI commits)
        entry: uv run python .github/badges/loc_badge.py
        language: system
        pass_filenames: false
        always_run: true
      - id: requirements-export
        name: requirements.txt export (GitHub dependency graph)
        entry: >
          uv export --frozen --all-extras --no-emit-project --no-hashes
          --quiet --output-file requirements.txt
        language: system
        pass_filenames: false
        always_run: true
