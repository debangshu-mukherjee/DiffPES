name: documentation

"on": [push, pull_request, workflow_dispatch]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra docs --extra test
      - name: Verify canonical, output-free tutorial notebooks
        run: |
          uv run --frozen python tests/_tutorials.py
      - name: Execute notebooks that lack a committed markdown export
        run: |
          while IFS= read -r -d '' notebook; do
            relative="${notebook#tutorials/}"
            export_md="docs/source/tutorials/${relative%.ipynb}.md"
            if [ -f "$export_md" ]; then
              echo "skip $notebook: committed export $export_md is authoritative"
              continue
            fi
            output_dir="$(dirname "$export_md")"
            mkdir -p "$output_dir"
            uv run --frozen jupyter nbconvert --to markdown --execute \
              --output-dir "$output_dir" "$notebook"
          done < <(find tutorials -type f -name '*.ipynb' -print0 | sort -z)
          git diff --exit-code -- tutorials docs/source/tutorials
      - name: Build strict documentation
        run: >-
          uv run --frozen sphinx-build -W -a -E --keep-going -b html
          docs/source docs/build/html
