name: documentation

"on": [push, pull_request, workflow_dispatch]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra docs --extra test --extra notebooks
      - name: Verify canonical, output-free tutorial notebooks
        run: |
          uv run --frozen python tests/_tutorials.py
      - name: Regenerate executed markdown exports and reject drift
        run: |
          for notebook in tutorials/*.ipynb; do
            uv run --frozen jupyter nbconvert --to markdown --execute \
              --output-dir docs/source/tutorials "$notebook"
          done
          git diff --exit-code -- tutorials docs/source/tutorials
      - name: Build strict documentation
        run: >-
          uv run --frozen sphinx-build -W -a -E --keep-going -b html
          docs/source docs/build/html
