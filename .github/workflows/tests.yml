# Run the repository tooling, coverage, documentation, and CPU-mesh checks.
name: tests

"on": [push, pull_request, workflow_dispatch]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src/ tests/
      - run: uv run --frozen ruff format --check src/ tests/
      - run: uv run --frozen pydoclint src/
      - run: uv run --frozen ty check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -c "import diffpes"
      - run: uv run --frozen pytest -m "not slow" --cov=diffpes --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
